# Render Blueprint for CertiTrust (https://render.com)
# One-click deploy: Render -> New -> Blueprint -> connect this GitHub repo -> Apply.
databases:
  - name: certitrust-db
    plan: free
    databaseName: certitrust
    user: certitrust

services:
  - type: web
    name: certitrust
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:application --bind 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FLASK_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: certitrust-db
          property: connectionString
      # BASE_VERIFY_URL is NOT hardcoded on purpose: Render automatically
      # injects RENDER_EXTERNAL_URL (= your real service URL), which the app
      # falls back to, so QR codes always point at the correct live URL even
      # if Render assigns a different service name.